name: Windows Build

on:
  push:
    branches:
      - "**"
    paths:
      - "vrt_setups_uploader/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read build version from commit message
        id: version
        shell: pwsh
        run: |
          $message = git log -1 --pretty=%B
          $match = [regex]::Match($message, '(?i)\[build\s+(V\d+\.\d+)\]')
          if (-not $match.Success) {
            "should_build=false" >> $env:GITHUB_OUTPUT
            "No build marker found in the commit message."
            exit 0
          }

          $baseVersion = $match.Groups[1].Value.ToUpperInvariant()
          $basePattern = '^' + [regex]::Escape($baseVersion) + '\.(\d+)$'
          $lastNumber = 0
          foreach ($tag in (git tag --list)) {
            $tagMatch = [regex]::Match($tag, $basePattern)
            if ($tagMatch.Success) {
              $number = [int]$tagMatch.Groups[1].Value
              if ($number -gt $lastNumber) { $lastNumber = $number }
            }
          }

          $version = "$baseVersion.$($lastNumber + 1)"
          "should_build=true" >> $env:GITHUB_OUTPUT
          "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "Build version: $version"

      - name: Set up Python 3.13
        if: steps.version.outputs.should_build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.version.outputs.should_build == 'true'
        working-directory: vrt_setups_uploader
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable
        if: steps.version.outputs.should_build == 'true'
        working-directory: vrt_setups_uploader
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7zr.exe" -OutFile 7zr.exe
          Invoke-WebRequest -Uri "https://github.com/ip7z/7zip/releases/download/26.02/7z2602-extra.7z" -OutFile 7z-extra.7z
          Invoke-WebRequest -Uri "https://www.rarlab.com/rar/unrarw64.exe" -OutFile UnRAR.exe
          .\7zr.exe x 7z-extra.7z -o7z-extra -y
          Copy-Item 7z-extra\x64\7za.exe 7za.exe
          Copy-Item 7z-extra\x64\7za.dll 7za.dll
          Copy-Item 7z-extra\x64\7zxa.dll 7zxa.dll
          python -m PyInstaller --onefile --clean --name "vrt_setup_uploader_$env:BUILD_VERSION" --add-binary "UnRAR.exe;." --add-binary "7za.exe;." --add-binary "7za.dll;." --add-binary "7zxa.dll;." main.py

      - name: Upload executable artifact
        if: steps.version.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vrt_setup_uploader-${{ steps.version.outputs.version }}
          path: vrt_setups_uploader/dist/vrt_setup_uploader_${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release and attach executable
        if: steps.version.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$env:BUILD_VERSION" `
            "vrt_setups_uploader/dist/vrt_setup_uploader_$env:BUILD_VERSION.exe" `
            --target "${{ github.sha }}" `
            --title "vrt_setup_uploader $env:BUILD_VERSION" `
            --generate-notes
